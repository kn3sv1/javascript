<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="btn">Click</button>
    <script>
      const btn = document.getElementById("btn");

      btn.addEventListener("custom-click", (e) => {
        console.log(e.detail.message);
      });

      // btn.dispatchEvent(
      //   new CustomEvent("custom-click", {
      //     detail: {
      //       message: "Hello",
      //     },
      //   }),
      // );

      // If we want the custom event to happen when clicking the button
      // we can combine them:
      // comment out line 17 - 23 and uncomment this:

      btn.addEventListener("click", () => {
        btn.dispatchEvent(
          new CustomEvent("custom-click", {
            detail: {
              message: "Hello",
            },
          }),
        );
      });
    </script>
  </body>
</html>
