<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./detail_page.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">MovieZone</div>

      <ul class="nav-links">
        <li>
          <a href="index.html">
            <i class="fa-regular fa-circle-play"></i>
            Now Showing
          </a>
        </li>

        <li>
          <a href="#">
            <i class="fa-regular fa-clock"></i>
            Coming Soon
          </a>
        </li>

        <li>
          <a href="#">
            <i class="fa-regular fa-calendar"></i>
            Calendar
          </a>
        </li>

        <li>
          <a href="#">
            <i class="fa-solid fa-ticket"></i>
            Buy Tickets
          </a>
        </li>
      </ul>
    </nav>
    <div id="movie-details"></div>

    <section id="movie-schedule"></section>

    <section id="movie-actions"></section>

    <section class="comment-section">
      <h2>Leave your comment below</h2>

      <form id="comment-form">
        <input id="comment-user" placeholder="Your name" />
        <textarea
          id="comment-input"
          placeholder="Write your comment here..."
        ></textarea>

        <button type="submit">Submit Comment</button>
      </form>
    </section>

    <script src="movie.js"></script>
  </body>
</html>
